<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
        </linearGradient>
        <filter id="shadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
            <feOffset dx="0" dy="4"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>
    <!-- Background rounded square -->
    <rect width="512" height="512" rx="112" fill="url(#bg)"/>
    <!-- Grid lines -->
    <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.25">
        <line x1="195" y1="120" x2="195" y2="392"/>
        <line x1="317" y1="120" x2="317" y2="392"/>
        <line x1="120" y1="195" x2="392" y2="195"/>
        <line x1="120" y1="317" x2="392" y2="317"/>
    </g>
    <!-- X marks -->
    <g stroke="#ffffff" stroke-width="20" stroke-linecap="round" filter="url(#shadow)">
        <!-- top-left X -->
        <line x1="140" y1="140" x2="180" y2="180"/>
        <line x1="180" y1="140" x2="140" y2="180"/>
        <!-- center X -->
        <line x1="236" y1="236" x2="276" y2="276"/>
        <line x1="276" y1="236" x2="236" y2="276"/>
        <!-- bottom-right X -->
        <line x1="332" y1="332" x2="372" y2="372"/>
        <line x1="372" y1="332" x2="332" y2="372"/>
    </g>
    <!-- O marks -->
    <g stroke="#ffffff" stroke-width="20" fill="none" filter="url(#shadow)" opacity="0.85">
        <!-- top-right O -->
        <circle cx="352" cy="160" r="22"/>
        <!-- bottom-left O -->
        <circle cx="160" cy="352" r="22"/>
    </g>
</svg>
